# Keeps baizakisaev.com/pitwall/ in step with the Pitwall repository
# (nolimitbaiza/f1_constructor_performance_tracker), which loads new race results after every
# race weekend (Mondays and Wednesdays, about 04:45 UTC). Every day this copies the app into
# pitwall/ (tools/sync_pitwall.py) and, if anything changed, commits it; the push redeploys the
# site on Railway. Otherwise it does nothing. Run it by hand from the Actions tab.
name: Sync Pitwall

on:
  schedule:
    - cron: "23 7 * * *" # every day, 07:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency: sync-pitwall

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Get the latest Pitwall
        uses: actions/checkout@v4
        with:
          repository: nolimitbaiza/f1_constructor_performance_tracker
          path: .pitwall-source
          sparse-checkout: docs

      - name: Copy the app into pitwall/
        run: python3 tools/sync_pitwall.py .pitwall-source

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pitwall
          if git diff --cached --quiet; then echo "Pitwall unchanged."; exit 0; fi
          git commit -m "Update Pitwall from its repository"
          git push
