# Runs on every push and pull request:
#   test       the trading model (tests/engine.test.js) and syntax checks
#   browsers   the site in real browsers and the release-upgrade check
#   container  the production image: it builds, the server config is valid, the addresses answer
#
# baizakisaev.com is put together by the portfolio repository (nolimitbaiza/portfolio), which
# copies this repository's publish.json files every hour. So the browsers and container jobs check
# out the portfolio, put this checkout in place of its copy of AI Grid Trader and run the portfolio's
# own checks: the demo and the case study are tested exactly as the live site would serve them.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax
        run: |
          node --check assets/engine.js
          node --check assets/app.js
          node --check tools/writing_numbers.js

      - name: Model tests
        run: node --test tests/engine.test.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax (tools and Streamlit app)
        run: python -m py_compile tools/*.py streamlit_app/app.py

  browsers:
    # The pages themselves in Firefox, Chromium and WebKit (Safari's engine), plus an iPad and
    # offline. Screenshots are kept as a downloadable artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-grid-trader

      - uses: actions/checkout@v4
        with:
          repository: nolimitbaiza/portfolio
          path: portfolio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The site, with this checkout as AI Grid Trader
        working-directory: portfolio
        run: python tools/sync_projects.py --local ai-grid-trader=../ai-grid-trader

      - name: Install Playwright browsers
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium firefox webkit

      - name: Browser checks
        working-directory: portfolio
        run: |
          python tools/serve.py 8600 > /dev/null 2>&1 &
          sleep 2
          python tools/browser_check.py http://localhost:8600/ shots firefox,chromium,webkit,ipad,offline

      - name: Release upgrade (returning visitors get new files, not cached ones)
        working-directory: portfolio
        run: python tools/upgrade_check.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: portfolio/shots/

  container:
    # Builds the image Railway runs (the portfolio's Dockerfile and Caddyfile) with this checkout's
    # files and checks the addresses the live site must answer.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-grid-trader

      - uses: actions/checkout@v4
        with:
          repository: nolimitbaiza/portfolio
          path: portfolio

      - name: The site, with this checkout as AI Grid Trader
        working-directory: portfolio
        run: python3 tools/sync_projects.py --local ai-grid-trader=../ai-grid-trader

      - name: Build the image
        working-directory: portfolio
        run: docker build -t site .

      - name: Smoke test
        working-directory: portfolio
        run: |
          docker run -d --name site -p 8080:8080 site
          sleep 2
          bash tools/smoke_test.sh http://localhost:8080

      - name: Server log
        if: always()
        run: docker logs site || true
