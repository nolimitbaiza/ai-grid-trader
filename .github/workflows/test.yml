# Runs the model's automated checks on every push and pull request.
# See tests/engine.test.js for what is checked.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax
        run: |
          node --check assets/engine.js
          node --check assets/app.js
          node --check sw.js

      - name: Model tests
        run: node --test tests/engine.test.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax (tools and Streamlit app)
        run: python -m py_compile tools/*.py streamlit_app/app.py

  browsers:
    # The page itself in Firefox, Chromium and WebKit (Safari's engine), plus an iPad and offline.
    # See tools/browser_check.py. Screenshots are kept as a downloadable artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright browsers
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium firefox webkit

      - name: Browser checks
        run: |
          python tools/serve.py 8600 > /dev/null 2>&1 &
          sleep 2
          python tools/browser_check.py http://localhost:8600/ shots firefox,chromium,webkit,ipad,offline

      - name: Release upgrade (returning visitors get new files, not cached ones)
        run: python tools/upgrade_check.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: shots/
